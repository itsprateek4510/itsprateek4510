<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="254" viewBox="0 0 1200 254" role="img" aria-labelledby="title desc">
  <title id="title">Offline mesh payment — packet journey</title>
  <desc id="desc">An offline device sends an encrypted payment packet through a peer-to-peer mesh. A relay with internet uploads it to the Spring Boot backend. Atomic deduplication prevents repeated packets from causing duplicate settlement.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 6 4 L 1 7" fill="none" stroke="#6a8ca5" stroke-width="1.5" />
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="252" rx="18" fill="#0a101b" stroke="#263547" stroke-width="2" />

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
    <text x="30" y="36" fill="#9bafc6" font-size="13" letter-spacing="1.8">PACKET JOURNEY / OFFLINE MESH PAYMENTS</text>
    <text x="1170" y="36" fill="#64f4d0" font-size="13" text-anchor="end">encrypted in transit</text>
  </g>

  <g fill="none" stroke="#6a8ca5" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 276 129 H 324" />
    <path d="M 576 129 H 624" />
    <path d="M 876 129 H 924" />
  </g>

  <rect x="28" y="65" width="248" height="127" rx="10" fill="#101f30" stroke="#2d4862" />
  <rect x="328" y="65" width="248" height="127" rx="10" fill="#101f30" stroke="#2d4862" />
  <rect x="628" y="65" width="248" height="127" rx="10" fill="#102528" stroke="#2a574e" />
  <rect x="928" y="65" width="244" height="127" rx="10" fill="#102528" stroke="#2a574e" />

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.5">
    <text x="48" y="92" fill="#79b8ff">01 / ORIGIN</text>
    <text x="348" y="92" fill="#79b8ff">02 / TRANSPORT</text>
    <text x="648" y="92" fill="#64f4d0">03 / BACKEND</text>
    <text x="948" y="92" fill="#64f4d0">04 / OUTCOME</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g fill="#e9f1fc" font-size="23" font-weight="650">
      <text x="48" y="128">Offline device</text>
      <text x="348" y="128">P2P mesh</text>
      <text x="648" y="128">Spring Boot</text>
      <text x="948" y="128">Settlement</text>
    </g>
    <g fill="#a3b7cc" font-size="16">
      <text x="48" y="155">Encrypted payment</text>
      <text x="48" y="176">RSA + AES-GCM</text>
      <text x="348" y="155">Relay the packet</text>
      <text x="348" y="176">Upload when connected</text>
      <text x="648" y="155">Process the upload</text>
      <text x="648" y="176">Atomic deduplication</text>
      <text x="948" y="155">One payment</text>
      <text x="948" y="176">Despite duplicate uploads</text>
    </g>
  </g>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13">
    <circle cx="35" cy="224" r="3" fill="#64f4d0" />
    <text x="48" y="229" fill="#9bafc6">Relays carry the payload. They do not get to read it.</text>
    <text x="1168" y="229" fill="#9bafc6" text-anchor="end">many uploads → one settlement</text>
  </g>
</svg>
