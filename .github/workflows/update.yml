name: Update terminal profile

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "assets/dark.svg"
      - "assets/light.svg"
      - "assets/portrait.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Generate profile
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_BIRTH_DATE: ${{ secrets.PROFILE_BIRTH_DATE }}
        run: python -m scripts.generate_profile
      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dark.svg assets/light.svg assets/portrait.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh terminal profile"
            git push
          fi
